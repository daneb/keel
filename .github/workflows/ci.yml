# CI for keel.
#
# Runs the same checks keel runs on itself, on a machine that is not the
# author's. "374 tests pass" was previously a claim about one laptop; this is
# what makes it a fact about the repository.
#
# Deliberately not `cargo fmt --check`: this codebase is hand-formatted in a
# compact style rustfmt does not reproduce, and .keel/keel.toml declares
# build/test/lint as the gate commands -- not fmt. CI enforces the standard the
# project adopted, not one it invented. See release.sh for the same decision.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Advisories land against dependencies that have not changed, so the audit
    # job needs a heartbeat rather than only running on a push.
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: build · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --quiet

      # The retrieval benchmark measures this repository's own index, because
      # its task set names real symbols here -- a synthetic fixture would
      # measure nothing. The index is a build artefact and gitignored, so a
      # fresh checkout has none and the benchmark cannot run. Building it here
      # is what makes CI verify the published 14.6x-at-100%-recall claim rather
      # than skip past it.
      - name: Build the symbol index
        run: ./target/debug/keel map

      - name: Test
        run: cargo test --quiet

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Runs the same check plugin G2 runs, rather than a second, divergent
      # definition of "audited". If the plugin's verdict rules change, CI
      # changes with them.
      - name: RustSec advisories
        run: |
          result="$(./.keel/checks/cargo-audit)"
          echo "$result"
          verdict="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["verdict"])')"
          case "$verdict" in
            pass)    echo "::notice::no known advisories" ;;
            blocked) echo "::warning::advisory check could not run — see the detail above" ;;
            *)       echo "::error::known advisories in the dependency tree"; exit 1 ;;
          esac

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      # Full history: the check scans every commit, and a shallow clone would
      # quietly reduce that to "the tip looked fine".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # The same check plugin G2 runs, so the two cannot drift.
      - name: Scan for credentials
        run: |
          result="$(./.keel/checks/secrets)"
          echo "$result"
          verdict="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["verdict"])')"
          case "$verdict" in
            pass)    echo "::notice::no credentials found" ;;
            blocked) echo "::warning::the secret scan could not run — see the detail above" ;;
            *)       echo "::error::credentials found in the repository"; exit 1 ;;
          esac
