# keel configuration — schema keel.config/1
# Budgets are enforced, not advised. Lower them until they hurt.

schema = "keel.config/1"

[map]
budget_lines = 400
codemap_budget_lines = 150
max_file_bytes = 1048576
codemap_min_files = 2
exclude = []

[store]
steering_budget_lines = 300

[[adapter]]
id = "claude"
out = "CLAUDE.md"
budget = 180
sections = [
    "conventions",
    "tech",
    "structure",
    "product",
    "lessons",
]
enabled = true

[[adapter]]
id = "agents"
out = "AGENTS.md"
budget = 180
sections = [
    "conventions",
    "tech",
    "structure",
    "product",
    "lessons",
]
enabled = true

[[adapter]]
id = "kiro"
out = ".kiro/steering/keel.md"
budget = 200
sections = [
    "conventions",
    "tech",
    "structure",
    "product",
    "lessons",
]
enabled = true

[[adapter]]
id = "copilot"
out = ".github/copilot-instructions.md"
budget = 120
sections = [
    "conventions",
    "tech",
    "structure",
    "product",
    "lessons",
]
enabled = true

[[review]]
id = "review"
cmd = ".keel/reviewers/heuristic"
timeout_secs = 60
advisory = false

[verify]
build = "cargo build --quiet"
test = "cargo test --quiet"
lint = "cargo clippy --all-targets --quiet"

[oracle]
test_cmd = "cargo test --quiet --test {file} -- --exact {name}"
doctest_cmd = "cargo test --doc --quiet"

[[ratchet]]
id = "clippy-warnings"
cmd = "cargo clippy --all-targets -q 2>&1 | grep -c '^warning' || true"
direction = "down"

[[ratchet]]
id = "tests-passing"
cmd = "cargo test --quiet 2>&1 | grep -o '[0-9]* passed' | awk '{s+=$1} END {print s}'"
direction = "up"

# The null driver: no model, always contract-correct. The fixed point of the
# conformance suite — if `keel driver check noop` fails, the harness is wrong.
[[driver]]
id = "noop"
cmd = ".keel/drivers/noop"
default = false
timeout_secs = 30

[[driver]]
id = "claude-code"
cmd = ".keel/drivers/claude-code"
default = true
timeout_secs = 900

# A second real tool, with a deliberately different CLI shape (prompt as an
# argv positional rather than stdin) — PLAN.md §6 asks for the interface to be
# proven against two tools before Phase 5 breadth.
[[driver]]
id = "codex"
cmd = ".keel/drivers/codex"
default = false
timeout_secs = 900

# Example — layering another repository's store underneath this one:
#
#   [[shared]]
#   id = "platform"
#   path = "../platform-standards/.keel/store"
#   required = true      # a missing required store fails doctor, G0 and G2

[[driver]]
id = "copilot"
cmd = ".keel/drivers/copilot"
default = false
timeout_secs = 900

[[driver]]
id = "kiro"
cmd = ".keel/drivers/kiro"
default = false
timeout_secs = 900

# A known RustSec advisory in the dependency tree fails G2 like any other
# check. `blocked` if cargo-audit is absent or its database is unreachable --
# "we did not look" must never read as "it is clean".
[[gate.G2.check]]
id = "cargo-audit"
cmd = ".keel/checks/cargo-audit"

# `keel run` commits build/test/lint/driver output as evidence, so a secret any
# of those commands prints becomes a committed artefact. This is the check that
# stops the audit trail becoming the leak. See SECURITY.md.
[[gate.G2.check]]
id = "secrets"
cmd = ".keel/checks/secrets"
