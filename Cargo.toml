[package]
# `keel` on crates.io is held by an unrelated 2018 Kubernetes client, and
# `keel-cli` by a different owner again. The binary installed here is still
# `keel` -- only the package name differs.
name = "keel-harness"
version = "0.2.1"
edition = "2024"
description = "A gated harness for AI-assisted delivery: auditable stopping conditions and durable memory across coding agents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/daneb/keel"
homepage = "https://daneb.github.io/keel/"
documentation = "https://github.com/daneb/keel/blob/master/GETTING-STARTED.md"
readme = "README.md"
keywords = ["agents", "codegen", "gates", "provenance", "harness"]
categories = ["development-tools", "command-line-utilities"]
# keel runs itself, so .keel/ holds hundreds of run and evidence files that
# have no business in a published package.
exclude = [".keel/", "docs/", "target/"]

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
globset = "0.4.20"
ignore = "0.4.33"
jsonschema = "0.50.0"
libc = "0.2.189"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = "0.4.46"
toml = "1.1.4"
tree-sitter = "0.26.12"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = "1.1.4"
